<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팬직 제품 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="환경 조건에 맞는 팬직 제품을 실물 사진으로 추천하고, 흡기·배기 효과와 설치 과정을 3D로 보여주는 영업 상담·학습용 시뮬레이터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 상단 바 + [왼쪽 조건·선택 | 3D 스테이지 | 오른쪽 추천·결과], 좁은 화면은 스테이지 위·패널 아래.
   밝은 단일 테마(흰 패널 + 아주 연한 회색 바탕). 흡기 = 파랑, 배기 = 주황, 팬직 브랜드 = 네이비·레드 */
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --panel-2: #f5f7fa;
  --line: #dde3ea;
  --fg: #0f1f33;
  --muted: #5b6b80;
  --accent: #1f63b5;
  --accent-a: rgba(31, 99, 181, 0.18);
  --brand: #0b4a8b;
  --brand-red: #e31e24;
  --intake: #0284c7;
  --exhaust: #ea580c;
  --good: #15803d;
  --warn: #b45309;
  --bad: #b91c1c;
  --before: #94a3b8;
  --grid: rgba(15, 31, 51, 0.08);
  --stage: #eef1f5;
  --f-display: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; cursor: pointer; }
table { color: inherit; font-family: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* 상단 바 */
.top { height: 58px; display: flex; align-items: center; gap: 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 5; }
.top .logo { height: 22px; width: auto; display: block; cursor: pointer; }
.top h1 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; color: var(--muted); }
.modes { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.modes button { background: none; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.modes button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.top .sp { flex: 1; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

.app { height: calc(100% - 58px); display: grid; grid-template-columns: 340px minmax(0, 1fr) 380px; }
.panel { background: var(--panel); overflow-y: auto; min-width: 0; padding-block: 16px; padding-left: 16px; padding-right: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.stage { position: relative; min-width: 0; background: var(--stage); overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fade { position: absolute; inset: 0; background: var(--stage); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#fade.on { opacity: 1; }

.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h2 { font-family: var(--f-display); font-size: 21px; margin: 2px 0 0; font-weight: 600; text-wrap: balance; }
h3 { font-size: 13px; margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.note { font-size: 11px; color: var(--muted); line-height: 1.55; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; font-weight: 600; padding: 0; }
.ctrl { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ctrl:hover { border-color: var(--accent); }
.ctrl.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.ctrl:disabled { opacity: 0.4; cursor: default; }
.ctrl.wide { justify-content: center; padding: 11px; font-size: 14px; }

/* 조건 설정 */
.fset { display: flex; flex-direction: column; gap: 8px; }
.fset > .lab { font-size: 12px; font-weight: 700; color: var(--fg); display: flex; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { color: var(--good); border-color: rgba(21, 128, 61, 0.3); background: rgba(21, 128, 61, 0.06); }
.chip.warn { color: var(--warn); border-color: rgba(180, 83, 9, 0.35); background: rgba(180, 83, 9, 0.06); }
.tog { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tog[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.range { display: flex; align-items: center; gap: 10px; }
.range input[type=range] { flex: 1; accent-color: var(--brand); }
.range output { font-family: var(--f-mono); font-size: 13px; min-width: 76px; text-align: right; }

/* 제품 카드 (사진) */
.rec { display: flex; flex-direction: column; gap: 10px; }
.pcard { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.pcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ph { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; position: relative; }
.ph img { width: 100%; height: 100%; object-fit: contain; }
.ph .soon { position: absolute; bottom: 4px; left: 4px; right: 4px; font-size: 9px; text-align: center; background: rgba(255, 255, 255, 0.85); color: var(--muted); border-radius: 4px; }
.pinfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pinfo b { font-size: 14px; }
.model { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.pact { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
.tile:hover { border-color: var(--accent); }
.tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tile b { font-size: 12px; line-height: 1.3; }
.tile .st { font-size: 11px; font-weight: 700; color: var(--accent); }
.rate { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px; font-size: 13px; font-weight: 700; flex: none; }
.rate.r0 { background: rgba(21, 128, 61, 0.1); color: var(--good); }
.rate.r1 { background: rgba(31, 99, 181, 0.1); color: var(--accent); }
.rate.r2 { background: rgba(91, 107, 128, 0.12); color: var(--muted); }
.seg { display: inline-flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.seg button { background: none; border: 0; padding: 3px 9px; border-radius: 5px; font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(15, 31, 51, 0.12); }
.seg button.in[aria-pressed="true"] { color: var(--intake); }
.seg button.ex[aria-pressed="true"] { color: var(--exhaust); }
.stepper { display: inline-flex; align-items: center; background: var(--panel); border-radius: 7px; border: 1px solid var(--line); }
.stepper button { width: 28px; height: 28px; background: none; border: 0; font-size: 16px; }
.stepper output { min-width: 30px; text-align: center; font-family: var(--f-mono); }
.filt { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.specs div { background: var(--panel-2); border-radius: 6px; padding: 5px 7px; }
.specs span { display: block; font-size: 10px; color: var(--muted); }
.specs em { font-style: normal; font-family: var(--f-mono); font-size: 12px; }
.specsel { display: flex; flex-direction: column; gap: 3px; }
.specsel select { width: 100%; font: inherit; font-size: 12px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.spect { width: 100%; border-collapse: collapse; font-size: 11px; }
.spect th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.spect td { padding: 5px 4px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.spect .num { text-align: right; font-family: var(--f-mono); }
.spect tbody tr { cursor: pointer; }
.spect tbody tr:hover td { background: var(--panel-2); }
.spect tr.on td { background: var(--accent-a); font-weight: 700; }
.feat { margin: 0; padding-left: 16px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.flowkey { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.flowkey i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

/* 스테이지 오버레이 */
.hud { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(255, 255, 255, 0.94); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 2px 10px rgba(15, 31, 51, 0.08); }
.tabs { display: flex; gap: 2px; background: var(--panel-2); border-radius: 8px; padding: 3px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 7px 11px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button b { font-family: var(--f-mono); margin-right: 4px; }
.tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
.timebox { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
.timebox input { flex: 1; accent-color: var(--brand); }
.clock { font-family: var(--f-mono); font-size: 14px; min-width: 56px; text-align: right; }
.hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: var(--muted); background: rgba(255, 255, 255, 0.85); border-radius: 6px; padding: 4px 8px; pointer-events: none; }
.legend { position: absolute; top: 12px; right: 12px; background: rgba(255, 255, 255, 0.94); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px; width: 220px; display: flex; flex-direction: column; gap: 6px; }
.legend .grad { height: 8px; border-radius: 4px; }
.legend .ends { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--f-mono); }
.legend .seg { display: flex; }
.legend .seg button { flex: 1; }
.step-cap { position: absolute; top: 12px; left: 12px; right: 250px; max-width: 520px; background: rgba(255, 255, 255, 0.95); border: 1px solid var(--line); border-left: 3px solid var(--brand-red); border-radius: 8px; padding: 10px 12px; }
.step-cap .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.step-cap b { display: block; font-size: 15px; margin: 2px 0; }

/* 단계 목록·KPI·차트 */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px; }
.steps li button:hover { background: var(--panel-2); }
.steps .no { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.steps .t { font-weight: 600; font-size: 13px; }
.steps .d { font-size: 12px; color: var(--muted); display: none; }
.steps li.cur button { background: var(--panel-2); border-color: var(--line); }
.steps li.cur .no { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }
.steps li.cur .d { display: block; }
.steps li.done .no { background: var(--brand); color: #fff; border-color: var(--brand); }
.mounts { display: flex; flex-direction: column; gap: 4px; }
.mounts p b { color: var(--fg); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lab { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .val { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; font-family: var(--f-body); }
.kpi .was { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.kpi .st { align-self: flex-start; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-top: 3px; }
.st.good { background: rgba(21, 128, 61, 0.1); color: var(--good); }
.st.bad { background: rgba(185, 28, 28, 0.1); color: var(--bad); }
.st.mid { background: rgba(180, 83, 9, 0.1); color: var(--warn); }
.chartbox { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.chartbox canvas { width: 100%; height: 170px; display: block; }
.keys { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.keys i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 4px; }
.keys i.b { border-top: 2px dashed var(--before); }
details.assume { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.assume summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 11px; color: var(--muted); }
.field input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 6px 8px; font-family: var(--f-mono); font-size: 13px; }

/* 제품 모드 */
.hero { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; align-items: start; }
.bars { display: flex; flex-direction: column; gap: 5px; }
.bars .b { display: grid; grid-template-columns: 110px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 11px; }
.bars .b span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.bars .b.me span:first-child { color: var(--fg); font-weight: 700; }
.bars .track { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.bars .track, .bars .fill { display: block; }
.bars .fill { height: 100%; background: var(--before); border-radius: 4px; }
.bars .b.me .fill { background: var(--brand); }
.bars .v { font-family: var(--f-mono); text-align: right; }
.uses { display: flex; flex-direction: column; gap: 6px; }
.use { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.use .nm { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.use .meter { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.use .meter i { display: block; height: 100%; background: var(--accent); }
.cust { display: flex; flex-direction: column; gap: 8px; }
.cust h4 { margin: 0; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.cust ul { margin: 0; padding-left: 16px; font-size: 12px; color: var(--fg); display: flex; flex-direction: column; gap: 2px; }
.cust .k { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 4px; }

/* 처음 화면 */
.home { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; display: flex; justify-content: center;
  padding-block: max(32px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home-in { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 22px; height: max-content; }
.home-in > img { height: 34px; width: auto; align-self: flex-start; }
.home h1 { font-family: var(--f-display); font-size: 30px; margin: 0; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.choice:hover { border-color: var(--brand); box-shadow: 0 6px 20px rgba(11, 74, 139, 0.1); }
.choice .who { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--brand-red); }
.choice b { font-family: var(--f-display); font-size: 20px; }
.choice .strip { display: flex; gap: 6px; }
.choice .strip img { width: 64px; height: 64px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.choice ol { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* 시트(요약·적합도 표) */
.sheet { position: fixed; inset: 0; background: rgba(15, 31, 51, 0.35); display: flex; justify-content: center; overflow-y: auto; padding: 16px; z-index: 15; }
.paper { background: #fff; color: #0d1b2e; width: 100%; max-width: 900px; border-radius: 12px; padding: 26px; display: flex; flex-direction: column; gap: 16px; height: max-content; box-shadow: 0 20px 50px rgba(15, 31, 51, 0.2); }
.paper h2 { color: #0b2a52; font-size: 22px; }
.paper .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.paper .meta img { height: 24px; }
.paper table { width: 100%; border-collapse: collapse; font-size: 13px; }
.paper th { text-align: left; font-size: 11px; color: #5a6b80; font-weight: 600; border-bottom: 2px solid #0b2a52; padding: 6px; }
.paper td { padding: 7px 6px; border-bottom: 1px solid #dbe3ec; }
.paper td.num, .paper th.num { text-align: right; }
.paper .big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.paper .big div { border: 1px solid #dbe3ec; border-radius: 8px; padding: 10px 12px; }
.paper .big span { font-size: 11px; color: #5a6b80; display: block; }
.paper .big b { font-family: var(--f-display); font-size: 22px; color: #0b2a52; font-variant-numeric: tabular-nums; }
.paper .foot { font-size: 11px; color: #5a6b80; line-height: 1.6; border-top: 1px solid #dbe3ec; padding-top: 10px; }
.paper .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.paper .acts button { border: 1px solid #0b2a52; background: #fff; color: #0b2a52; border-radius: 7px; padding: 7px 14px; font-weight: 600; }
.paper .acts button.pri { background: #0b2a52; color: #fff; }
.tw { overflow-x: auto; }
.mx th, .mx td { text-align: center; padding: 5px 4px; }
.mx th:first-child, .mx td:first-child { text-align: left; white-space: nowrap; }
.mx td button { width: 30px; height: 26px; border-radius: 6px; border: 0; font-weight: 700; }
.mx td button.r0 { background: rgba(21, 128, 61, 0.14); color: var(--good); }
.mx td button.r1 { background: rgba(31, 99, 181, 0.12); color: var(--accent); }
.mx td button.r2 { background: rgba(91, 107, 128, 0.12); color: var(--muted); }
.mx td button.x { background: rgba(31, 99, 181, 0.04); color: var(--accent); outline: 1px dashed rgba(31, 99, 181, 0.4); }
.mx .pn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-align: left; }

@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
@media (max-width: 1180px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stage { grid-column: 1 / -1; order: -1; height: 60vh; min-height: 380px; }
  .panel { overflow: visible; }
  .top h1 { display: none; }
}
@media (max-width: 760px) {
  .top { gap: 8px; }
  .modes button { padding: 6px 8px; font-size: 12px; }
  .tag { display: none; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel.left, .panel.right { border: 0; border-top: 1px solid var(--line); }
  .panel { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stage { height: 56vh; min-height: 340px; }
  .legend { width: 170px; }
  .step-cap { right: 12px; top: auto; bottom: 120px; }
  .choices { grid-template-columns: minmax(0, 1fr); }
  .home h1 { font-size: 24px; }
  .paper { padding: 18px; }
  .paper .big { grid-template-columns: minmax(0, 1fr); }
  .pcard { grid-template-columns: 88px minmax(0, 1fr); }
  .hero { grid-template-columns: 100px minmax(0, 1fr); }
}
@media (max-width: 420px) { .top .logo { height: 18px; } }

<body>
<header class="top">
  <img class="logo" id="logo" alt="FANZIC" title="처음 화면">
  <h1>제품 시뮬레이터</h1>
  <nav class="modes" aria-label="보기 방식">
    <button type="button" data-mode="env" aria-pressed="false">환경에서 찾기</button>
    <button type="button" data-mode="product" aria-pressed="false">제품에서 찾기</button>
    <button type="button" data-mode="matrix" aria-pressed="false">적합도 표</button>
  </nav>
  <span class="sp"></span>
  <span class="seg" role="group" aria-label="전원 주파수"><button type="button" data-hz="60" aria-pressed="true">60Hz</button><button type="button" data-hz="50" aria-pressed="false">50Hz</button></span>
  <span class="tag">영업 상담·학습용 · 참고 추정치</span>
</header>

<main class="app">
  <aside class="panel left" id="left"></aside>
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D 보기"></canvas>
    <div id="fade"></div>
    <div class="hint" id="hint">드래그: 회전 · 휠/핀치: 확대 · 우클릭 드래그: 이동</div>
    <div class="step-cap" id="stepCap" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hud" id="hud" hidden></div>
  </section>
  <aside class="panel right" id="right"></aside>
</main>

<div class="home" id="home">
  <div class="home-in">
    <img id="homeLogo" alt="FANZIC">
    <div>
      <div class="eyebrow">팬직 제품 시뮬레이터</div>
      <h1>무엇부터 볼까요?</h1>
    </div>
    <div class="choices">
      <button type="button" class="choice" data-go="env">
        <span class="who">고객 상담</span>
        <b>환경에서 찾기</b>
        <ol><li>공간 용도·크기·문제·설치 위치를 고르면</li><li>맞는 팬직 제품을 실물 사진으로 추천하고</li><li>흡기·배기 효과와 설치 과정을 3D로 보여 줍니다</li></ol>
        <span class="strip" id="stripEnv"></span>
      </button>
      <button type="button" class="choice" data-go="product">
        <span class="who">영업 학습 · 타깃 발굴</span>
        <b>제품에서 찾기</b>
        <ol><li>제품을 고르면 특징·사양·흡기/배기 원리를 보고</li><li>잘 맞는 환경 순위와 찾아갈 고객군을 확인한 뒤</li><li>그 환경으로 바로 시뮬레이션할 수 있습니다</li></ol>
        <span class="strip" id="stripProd"></span>
      </button>
    </div>
    <button type="button" class="ctrl" data-go="matrix" style="align-self:flex-start">제품 × 용도 적합도 표 보기</button>
    <p class="note">적합도는 「제품별 용도 메트릭스」 기준이며, 효과 수치는 단순 모델로 계산한 참고 추정치입니다.</p>
  </div>
</div>
<div class="sheet" id="sheet" hidden></div>

<script src="js/effects.js"></script>

<script src="js/showcase.js"></script>
<script src="js/app.js"></script>
</body>
