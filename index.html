<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팬직 현장 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 상단 바 + [좌측 현장·제품 패널 | 3D 스테이지 | 우측 결과 패널], 좁은 화면에서는 스테이지 위·패널 아래로 쌓임.
   단일 다크 테마(쇼룸 디오라마 톤). 공기 흐름 = 시안, 팬직 브랜드 = 네이비·레드 */
:root {
  --bg: #07111f;
  --panel: #0c1a2c;
  --panel-2: #112540;
  --line: #1e3554;
  --fg: #e7eff9;
  --muted: #8ea4bf;
  --accent: #38bdf8;
  --accent-a: rgba(56, 189, 248, 0.26);
  --brand: #1f63b5;
  --brand-red: #e31e24;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --before: #8b9bb0;
  --grid: rgba(142, 164, 191, 0.14);
  --f-display: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; cursor: pointer; }
table { color: inherit; font-family: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.top { height: 56px; display: flex; align-items: center; gap: 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 5; }
.logo { background: #fff; border-radius: 6px; padding: 5px 9px; display: flex; align-items: center; }
.logo img { height: 20px; width: auto; display: block; }
.top h1 { font-family: var(--f-display); font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.01em; white-space: nowrap; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.crumb button { background: none; border: 0; padding: 4px 6px; border-radius: 4px; color: var(--muted); }
.crumb button:hover { color: var(--fg); background: var(--panel-2); }
.crumb b { color: var(--fg); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sp { flex: 1; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

.app { height: calc(100% - 56px); display: grid; grid-template-columns: 320px minmax(0, 1fr) 360px; }
.panel { background: var(--panel); overflow-y: auto; min-width: 0; padding-block: 16px; padding-left: 16px; padding-right: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.stage { position: relative; min-width: 0; background: #0a1422; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#fade { position: absolute; inset: 0; background: #0a1422; opacity: 0; pointer-events: none; transition: opacity 0.35s; }
#fade.on { opacity: 1; }

.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h2 { font-family: var(--f-display); font-size: 22px; margin: 2px 0 0; font-weight: 600; text-wrap: balance; }
h3 { font-size: 13px; margin: 0; font-weight: 600; color: var(--fg); }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* 현장 목록 */
.sites { display: flex; flex-direction: column; gap: 6px; }
.site-btn { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; }
.site-btn:hover, .site-btn.hover { border-color: var(--accent); }
.site-btn b { font-size: 14px; font-weight: 600; }
.site-btn .sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.site-btn .kpi { font-family: var(--f-mono); font-size: 12px; color: var(--accent); align-self: center; }

/* 지도 위 핀 */
#pins { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; background: rgba(12, 26, 44, 0.86); border: 1px solid var(--line); color: var(--fg);
  border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; backdrop-filter: blur(4px); }
.pin::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }
.pin:hover, .pin.hover { border-color: var(--accent); background: var(--panel-2); }

/* 스테이지 오버레이 */
.hud { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: rgba(12, 26, 44, 0.9); border: 1px solid var(--line); border-radius: 10px; padding: 8px; backdrop-filter: blur(6px); }
.tabs { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
.tabs button { background: none; border: 0; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
.ctrl { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ctrl:hover { border-color: var(--accent); }
.ctrl.primary { background: var(--accent); color: #062033; border-color: var(--accent); }
.ctrl:disabled { opacity: 0.4; cursor: default; }
.timebox { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
.timebox input { flex: 1; accent-color: var(--accent); }
.clock { font-family: var(--f-mono); font-size: 14px; min-width: 64px; text-align: right; }
.hint { position: absolute; top: 12px; left: 12px; font-size: 12px; color: var(--muted); background: rgba(12, 26, 44, 0.8); border-radius: 6px; padding: 4px 8px; pointer-events: none; }
.legend { position: absolute; top: 12px; right: 12px; background: rgba(12, 26, 44, 0.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px; width: 210px; display: flex; flex-direction: column; gap: 6px; }
.legend .grad { height: 8px; border-radius: 4px; }
.legend .ends { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--f-mono); }
.seg { display: flex; gap: 2px; background: var(--bg); border-radius: 6px; padding: 2px; }
.seg button { flex: 1; white-space: nowrap; background: none; border: 0; padding: 4px 6px; border-radius: 4px; font-size: 11px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.step-cap { position: absolute; top: 12px; left: 12px; right: 240px; max-width: 520px; background: rgba(12, 26, 44, 0.92); border: 1px solid var(--line); border-left: 3px solid var(--brand-red); border-radius: 8px; padding: 10px 12px; }
.step-cap .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.step-cap b { display: block; font-size: 15px; margin: 2px 0; }

/* 패널 공통 */
.card { background: var(--panel-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 11px; color: var(--muted); }
.field input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 6px 8px; font-family: var(--f-mono); font-size: 13px; }
.prod { background: var(--panel-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; }
.prod .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.prod b { font-size: 14px; }
.prod .model { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.specs div { background: var(--bg); border-radius: 6px; padding: 5px 7px; }
.specs span { display: block; font-size: 10px; color: var(--muted); }
.specs em { font-style: normal; font-family: var(--f-mono); font-size: 12px; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 7px; border: 1px solid var(--line); }
.stepper button { width: 30px; height: 30px; background: none; border: 0; font-size: 16px; }
.stepper button:hover { color: var(--accent); }
.stepper output { min-width: 34px; text-align: center; font-family: var(--f-mono); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.rep { color: var(--warn); border-color: rgba(251, 191, 36, 0.4); }
.linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 0; }

/* 단계 목록 */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px; }
.steps li button:hover { background: var(--panel-2); }
.steps .no { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.steps .t { font-weight: 600; font-size: 13px; }
.steps .d { font-size: 12px; color: var(--muted); display: none; }
.steps li.cur button { background: var(--panel-2); border-color: var(--line); }
.steps li.cur .no { background: var(--brand-red); color: #fff; border-color: var(--brand-red); }
.steps li.cur .d { display: block; }
.steps li.done .no { background: var(--brand); color: #fff; border-color: var(--brand); }
.mounts { display: flex; flex-direction: column; gap: 4px; }
.mounts p { font-size: 12px; color: var(--muted); }
.mounts p b { color: var(--fg); font-weight: 600; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lab { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .val { font-family: var(--f-display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; font-family: var(--f-body); }
.kpi .was { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.kpi .st { align-self: flex-start; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-top: 3px; }
.st.good { background: rgba(74, 222, 128, 0.15); color: var(--good); }
.st.bad { background: rgba(248, 113, 113, 0.15); color: var(--bad); }
.st.mid { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
.kpi.wide { grid-column: 1 / -1; }
.chartbox { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.chartbox canvas { width: 100%; height: 170px; display: block; }
.keys { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.keys i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 4px; }
.keys i.b { border-top: 2px dashed var(--before); }
details.assume { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
details.assume summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.assume .fields { margin-top: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.note { font-size: 11px; color: var(--muted); line-height: 1.55; }

/* 효과 요약 표(지도 화면) */
.overview { width: 100%; border-collapse: collapse; font-size: 12px; }
.overview th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.overview td { padding: 7px 4px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.overview td.num { text-align: right; white-space: nowrap; }
.overview tr { cursor: pointer; }
.overview tr:hover td { background: var(--panel-2); }
.arrow { color: var(--muted); }

/* 상담 요약 시트 */
.sheet { position: absolute; inset: 0; background: rgba(7, 17, 31, 0.92); display: flex; justify-content: center; overflow-y: auto; padding: 16px; z-index: 4; }
.paper { background: #f7f9fc; color: #0d1b2e; width: 100%; max-width: 820px; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 18px; height: max-content; }
.paper h2 { color: #0b2a52; font-size: 24px; }
.paper .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.paper .meta img { height: 26px; }
.paper table { width: 100%; border-collapse: collapse; font-size: 13px; }
.paper th { text-align: left; font-size: 11px; color: #5a6b80; font-weight: 600; border-bottom: 2px solid #0b2a52; padding: 6px; }
.paper td { padding: 7px 6px; border-bottom: 1px solid #dbe3ec; }
.paper td.num, .paper th.num { text-align: right; }
.paper .big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.paper .big div { border: 1px solid #dbe3ec; border-radius: 8px; padding: 10px 12px; }
.paper .big span { font-size: 11px; color: #5a6b80; display: block; }
.paper .big b { font-family: var(--f-display); font-size: 22px; color: #0b2a52; font-variant-numeric: tabular-nums; }
.paper .foot { font-size: 11px; color: #5a6b80; line-height: 1.6; border-top: 1px solid #dbe3ec; padding-top: 10px; }
.paper .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.paper .acts button { border: 1px solid #0b2a52; background: #fff; color: #0b2a52; border-radius: 7px; padding: 7px 14px; font-weight: 600; }
.paper .acts button.pri { background: #0b2a52; color: #fff; }
.paper .tw { overflow-x: auto; }
.paper .story { font-size: 14px; color: #33475e; }

@media (prefers-reduced-motion: reduce) { #fade { transition: none; } }

@media (max-width: 1180px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .stage { grid-column: 1 / -1; order: -1; height: 62vh; min-height: 380px; }
  .panel.left { border-right: 1px solid var(--line); }
  .panel { overflow: visible; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel.left, .panel.right { border: 0; border-top: 1px solid var(--line); }
  .panel { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top h1 { display: none; }
  .tag { display: none; }
  .stage { height: 58vh; min-height: 340px; }
  .legend { width: 170px; }
  .step-cap { right: 12px; top: auto; bottom: 120px; }
  .paper { padding: 18px; }
  .paper .big { grid-template-columns: minmax(0, 1fr); }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<header class="top">
  <span class="logo"><img id="logo" alt="FANZIC"></span>
  <h1>현장 설치·효과 시뮬레이터</h1>
  <nav class="crumb" aria-label="위치">
    <button id="crumbHome" type="button">전체 현장</button>
    <span id="crumbSep" hidden>›</span>
    <b id="crumbSite"></b>
  </nav>
  <span class="sp"></span>
  <span class="tag">영업 상담용 · 참고 추정치</span>
</header>

<main class="app">
  <aside class="panel left" id="left"></aside>
  <section class="stage" id="stage">
    <canvas id="gl" aria-label="3D 현장 보기"></canvas>
    <div id="pins"></div>
    <div id="fade"></div>
    <div class="hint" id="hint">드래그: 회전 · 휠/핀치: 확대 · 우클릭 드래그: 이동</div>
    <div class="step-cap" id="stepCap" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="hud" id="hud" hidden></div>
    <div class="sheet" id="sheet" hidden></div>
  </section>
  <aside class="panel right" id="right"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data/logo.js"></script>
<script src="data/products.js"></script>
<script src="data/sites.js"></script>
<script src="js/sim.js"></script>
<script src="js/models.js"></script>
<script src="js/scene.js"></script>
<script src="js/effects.js"></script>
<script src="js/install.js"></script>
<script src="js/app.js"></script>
</body>
</html>
